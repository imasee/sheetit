name: Deploy Sheetit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inject the public OAuth client ID
        run: node scripts/inject-google-client-id.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
          SPREADSHEET_NAMING_PATTERN: ${{ vars.SPREADSHEET_NAMING_PATTERN }}
          DEFAULT_SPREADSHEET_NAME: ${{ vars.DEFAULT_SPREADSHEET_NAME }}
      - name: Build Angular app for the custom domain
        run: npm run build -- --configuration production --base-href /
      - name: Add SPA fallback page
        run: cp dist/sheetit/browser/index.html dist/sheetit/browser/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sheetit/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
