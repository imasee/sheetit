<section class="page-heading"><div><div class="eyebrow">YOUR NETWORK</div><h1>People</h1><p class="subtitle">Manage contacts and review balances by currency.</p></div><button class="ts-button-primary" type="button" (click)="openPersonDialog()" [disabled]="!workspace.active()"><mat-icon>person_add</mat-icon>Add person</button></section>
<section class="people-table-section" aria-label="People and balances">
  <div class="table-intro"><div><h2>People ledger</h2><p>{{ activeCount() }} active · {{ archivedCount() }} archived</p></div><div class="table-tools"><label class="people-search" for="people-search"><mat-icon aria-hidden="true">search</mat-icon><input id="people-search" class="ts-control" type="search" placeholder="Search people" [value]="peopleSearch()" (input)="peopleSearch.set($any($event.target).value)" /></label><label for="people-filter">Status</label><select id="people-filter" class="ts-control people-filter" [value]="personFilter()" (change)="personFilter.set($any($event.target).value)"><option value="Active">Active</option><option value="Archived">Archived</option><option value="All">All people</option></select><label for="people-balance-filter">Balance</label><select id="people-balance-filter" class="ts-control people-filter" [value]="balanceFilter()" (change)="setBalanceFilter($any($event.target).value)"><option value="All">All currencies</option>@for (currency of currencies; track currency) { <option [value]="currency">{{ currency }}</option> }</select></div></div>
  @if (workspace.active()) {
    <ts-peer-balance-table [entries]="visiblePeerRows()" [emptyMessage]="peerRows().length ? 'No people match these search and filter settings.' : 'No people to show yet.'" [transactions]="store.transactions()" [allowEdit]="true" [allowPersonActions]="true" (editPerson)="openPersonDialog($event)" (archivePerson)="archivePerson($event)" (restorePerson)="restorePerson($event)" (deletePerson)="deletePerson($event)" />
  } @else {
    <div class="table-empty"><mat-icon>table_view</mat-icon><strong>Connect a spreadsheet to manage people</strong><span>Once a ledger is selected, your contacts will appear here.</span></div>
  }
</section>
