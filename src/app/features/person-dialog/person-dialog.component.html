<div class="person-dialog-head">
  <div><span class="person-dialog-kicker">YOUR CONTACTS</span><h2 mat-dialog-title id="person-dialog-title">{{ data.person ? 'Edit person' : 'Add a person' }}</h2><p>{{ data.person ? 'Update this person’s contact details.' : 'Add someone to your peer ledger.' }}</p></div>
  <button class="dialog-close" mat-dialog-close type="button" aria-label="Close person form"><mat-icon>close</mat-icon></button>
</div>
<mat-dialog-content class="person-dialog-content">
  <form class="person-form" [formGroup]="form" (ngSubmit)="save()" id="person-form">
    <label><span class="field-label">Name <span class="field-optional required">Required</span></span><input class="ts-control" formControlName="name" maxlength="100" autocomplete="name" placeholder="Full name" />@if (form.controls.name.touched && form.controls.name.invalid) { <span class="field-error">Enter a name (up to 100 characters).</span> }</label>
    <div class="person-contact-fields"><label><span class="field-label">Phone <span class="field-optional">Optional</span></span><input class="ts-control" formControlName="phone" maxlength="40" type="tel" autocomplete="tel" placeholder="Phone number" /></label><label><span class="field-label">Email <span class="field-optional">Optional</span></span><input class="ts-control" formControlName="email" maxlength="254" type="email" autocomplete="email" placeholder="name@example.com" />@if (form.controls.email.touched && form.controls.email.invalid) { <span class="field-error">Enter a valid email address.</span> }</label></div>
    @if (showLocalComments) { <label><span class="field-label">Notes <span class="field-optional">Optional</span></span><textarea class="ts-control" formControlName="notes" rows="3" maxlength="500" placeholder="Private details for your records"></textarea></label> }
    @if (error(); as message) { <div class="flex items-start gap-2 rounded-lg border border-[var(--theme-negative-border)] bg-[var(--theme-negative-soft)] p-3 text-sm font-medium text-[var(--theme-negative)]" role="alert"><mat-icon>error_outline</mat-icon><span>{{ message }}</span></div> }
  </form>
</mat-dialog-content>
<div class="person-dialog-actions"><button class="ts-button-secondary" type="button" mat-dialog-close [disabled]="saving()">Cancel</button><button class="ts-button-primary" type="submit" form="person-form" [disabled]="saving()"><mat-icon>{{ saving() ? 'sync' : 'check' }}</mat-icon>{{ saving() ? 'Saving…' : data.person ? 'Save changes' : 'Add person' }}</button></div>
