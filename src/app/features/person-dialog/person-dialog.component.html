<div class="person-dialog-head">
  <div><span class="person-dialog-kicker">YOUR CONTACTS</span><h2 mat-dialog-title id="person-dialog-title">{{ data.person ? 'Edit person' : 'Add a person' }}</h2><p>{{ data.person ? 'Update this person’s contact details.' : 'Add someone to your peer ledger.' }}</p></div>
  <button class="dialog-close" mat-dialog-close type="button" aria-label="Close person form"><mat-icon>close</mat-icon></button>
</div>
<mat-dialog-content class="!max-h-[75vh] !px-6 !pb-5">
  <form class="grid gap-4 pt-2" [formGroup]="form" (ngSubmit)="save()" id="person-form">
    <label class="grid gap-2 text-sm font-semibold text-[var(--text-primary)]">Name <span class="text-xs font-medium text-[var(--theme-negative)]">Required</span><input class="ts-control" formControlName="name" maxlength="100" autocomplete="name" placeholder="Full name" />@if (form.controls.name.touched && form.controls.name.invalid) { <span class="text-xs font-medium text-[var(--theme-negative)]">Enter a name (up to 100 characters).</span> }</label>
    <div class="grid grid-cols-2 gap-3 max-[460px]:grid-cols-1"><label class="grid gap-2 text-sm font-semibold text-[var(--text-primary)]">Phone <span class="font-normal text-[var(--text-secondary)]">Optional</span><input class="ts-control" formControlName="phone" maxlength="40" type="tel" autocomplete="tel" placeholder="Phone number" /></label><label class="grid gap-2 text-sm font-semibold text-[var(--text-primary)]">Email <span class="font-normal text-[var(--text-secondary)]">Optional</span><input class="ts-control" formControlName="email" maxlength="254" type="email" autocomplete="email" placeholder="name@example.com" />@if (form.controls.email.touched && form.controls.email.invalid) { <span class="text-xs font-medium text-[var(--theme-negative)]">Enter a valid email address.</span> }</label></div>
    @if (showLocalComments) { <label class="grid gap-2 text-sm font-semibold text-[var(--text-primary)]">Notes <span class="font-normal text-[var(--text-secondary)]">Optional</span><textarea class="ts-control min-h-24 resize-y" formControlName="notes" rows="3" maxlength="500" placeholder="Private details for your records"></textarea></label> }
    @if (error(); as message) { <div class="flex items-start gap-2 rounded-lg border border-[var(--theme-negative-border)] bg-[var(--theme-negative-soft)] p-3 text-sm font-medium text-[var(--theme-negative)]" role="alert"><mat-icon>error_outline</mat-icon><span>{{ message }}</span></div> }
  </form>
</mat-dialog-content>
<div class="person-dialog-actions"><button class="ts-button-secondary" type="button" mat-dialog-close [disabled]="saving()">Cancel</button><button class="ts-button-primary" type="submit" form="person-form" [disabled]="saving()"><mat-icon>{{ saving() ? 'sync' : 'check' }}</mat-icon>{{ saving() ? 'Saving…' : data.person ? 'Save changes' : 'Add person' }}</button></div>
